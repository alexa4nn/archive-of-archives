<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Object Pile</title>
<style>
  @font-face {
    font-family: 'oceanside';
    src: url('fonts/Oceanside Typewriter.ttf') format('woff2');
    font-weight: 400;
    font-style: normal;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'oceanside', monospace;
    cursor: grab;
  }

  body.dragging { cursor: grabbing; }

  canvas { display: block; }

  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 10;
  }

  #title {
    position: fixed;
    top: 32px;
    left: 40px;
    z-index: 20;
    pointer-events: none;
  }

  #title h1 {
    font-size: 84px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: lowercase;
    color: #e0e0e0;
    margin-bottom: 6px;
  }

  #title p {
    font-size: 32px;
    letter-spacing: 2px;
    color: #666;
    text-transform: lowercase;
  }

  #hint {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    pointer-events: none;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #444;
    transition: opacity 0.8s;
  }

  #loading {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.6s;
  }

  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #loading .spinner {
    width: 40px;
    height: 40px;
    border: 2px solid #222;
    border-top-color: #888;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .vignette {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 5;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div></div>
<div class="vignette"></div>

<div id="title">
  <h1>archive of archives</h1>
  <p>during the Spring of 2026, x members of the school for poetic computation created archives. this is an archive of archives</p>
</div>

<div id="hint">click and drag to throw objects</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import * as CANNON from 'cannon-es';

// ── Scene Setup ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.Fog(0x0a0a0a, 8, 25);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 3, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ── Orbit Controls ──
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 + 0.1;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.update();

// ── Lighting ──
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 2.5);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.1;
dirLight.shadow.camera.far = 30;
dirLight.shadow.camera.left = -8;
dirLight.shadow.camera.right = 8;
dirLight.shadow.camera.top = 8;
dirLight.shadow.camera.bottom = -8;
dirLight.shadow.bias = -0.002;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x8899cc, 0.8);
fillLight.position.set(-3, 5, -3);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xff6633, 1.5, 15);
rimLight.position.set(-4, 3, -2);
scene.add(rimLight);

// ── Ground ──
const groundGeo = new THREE.PlaneGeometry(30, 30);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x111111,
  roughness: 0.85,
  metalness: 0.1,
});
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// Grid lines on ground
const gridHelper = new THREE.GridHelper(30, 60, 0x1a1a1a, 0x1a1a1a);
gridHelper.position.y = 0.005;
scene.add(gridHelper);

// ── Physics World ──
const world = new CANNON.World({
  gravity: new CANNON.Vec3(0, -9.82, 0),
});
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.defaultContactMaterial.friction = 0.5;
world.defaultContactMaterial.restitution = 0.3;

// Ground physics body
const groundBody = new CANNON.Body({
  mass: 0,
  shape: new CANNON.Plane(),
});
groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(groundBody);

// Invisible walls
const wallShape = new CANNON.Plane();
const walls = [
  { pos: [6, 5, 0], rot: [0, -Math.PI / 2, 0] },
  { pos: [-6, 5, 0], rot: [0, Math.PI / 2, 0] },
  { pos: [0, 5, 6], rot: [0, Math.PI, 0] },
  { pos: [0, 5, -6], rot: [0, 0, 0] },
];
walls.forEach(w => {
  const b = new CANNON.Body({ mass: 0, shape: wallShape });
  b.position.set(...w.pos);
  b.quaternion.setFromEuler(...w.rot);
  world.addBody(b);
});

// ── Load GLB Model ──
const loader = new GLTFLoader();
const objectBodies = []; // { mesh, body } pairs

function loadModel() {
  return new Promise((resolve, reject) => {
    loader.load('lilly.glb', (gltf) => {
      resolve(gltf.scene);
    }, undefined, reject);
  });
}

const templateModel = await loadModel();

// Compute bounding box of model
const bbox = new THREE.Box3().setFromObject(templateModel);
const size = new THREE.Vector3();
bbox.getSize(size);
const center = new THREE.Vector3();
bbox.getCenter(center);

// Scale model to reasonable size (target ~1m tall)
const maxDim = Math.max(size.x, size.y, size.z);
const scaleFactor = 1.0 / maxDim;

function createPhysicsObject(position, rotation) {
  const model = templateModel.clone();

  // Deep clone materials so each instance is independent
  model.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      child.material = child.material.clone();
    }
  });

  model.scale.setScalar(scaleFactor);

  // Center the model geometry
  model.position.set(
    -center.x * scaleFactor,
    -center.y * scaleFactor,
    -center.z * scaleFactor
  );

  // Wrapper group for physics sync
  const wrapper = new THREE.Group();
  wrapper.add(model);
  scene.add(wrapper);

  // Physics body — use a box approximation
  const halfExtents = new CANNON.Vec3(
    (size.x * scaleFactor) / 2,
    (size.y * scaleFactor) / 2,
    (size.z * scaleFactor) / 2
  );
  const shape = new CANNON.Box(halfExtents);
  const body = new CANNON.Body({
    mass: 2,
    shape: shape,
    position: new CANNON.Vec3(position.x, position.y, position.z),
    linearDamping: 0.3,
    angularDamping: 0.4,
  });

  // Random initial rotation
  body.quaternion.setFromEuler(
    rotation.x || Math.random() * Math.PI,
    rotation.y || Math.random() * Math.PI,
    rotation.z || Math.random() * Math.PI
  );

  world.addBody(body);
  objectBodies.push({ mesh: wrapper, body, halfExtents });

  return { mesh: wrapper, body };
}

// Spawn 3 objects with staggered drops
const spawnPositions = [
  { x: -0.8, y: 5, z: 0.3 },
  { x: 0.5, y: 7, z: -0.4 },
  { x: 0.0, y: 9, z: 0.6 },
];

spawnPositions.forEach((pos, i) => {
  setTimeout(() => {
    createPhysicsObject(
      new THREE.Vector3(pos.x, pos.y, pos.z),
      new THREE.Vector3(Math.random() * 2, Math.random() * 2, Math.random() * 2)
    );
  }, i * 600);
});

// ── Hide Loading ──
document.getElementById('loading').classList.add('hidden');

// ── Drag / Throw Interaction ──
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let dragging = null; // { obj, joint, plane, offset, prevPos, velocity }

function getMouseNDC(event) {
  const x = (event.clientX / window.innerWidth) * 2 - 1;
  const y = -(event.clientY / window.innerHeight) * 2 + 1;
  return new THREE.Vector2(x, y);
}

renderer.domElement.addEventListener('pointerdown', (event) => {
  mouse.copy(getMouseNDC(event));
  raycaster.setFromCamera(mouse, camera);

  const meshes = objectBodies.map(o => o.mesh);
  const allChildren = [];
  meshes.forEach(m => m.traverse(c => { if (c.isMesh) allChildren.push(c); }));

  const intersects = raycaster.intersectObjects(allChildren, false);
  if (intersects.length === 0) return;

  // Find which objectBody this mesh belongs to
  const hitMesh = intersects[0].object;
  let found = null;
  for (const obj of objectBodies) {
    let match = false;
    obj.mesh.traverse(c => { if (c === hitMesh) match = true; });
    if (match) { found = obj; break; }
  }
  if (!found) return;

  event.preventDefault();
  controls.enabled = false;
  document.body.classList.add('dragging');

  // Wake up the body
  found.body.wakeUp();
  found.body.type = CANNON.Body.KINEMATIC;

  const hitPoint = intersects[0].point;

  // Create a drag plane facing the camera
  const planeNormal = new THREE.Vector3();
  camera.getWorldDirection(planeNormal);
  const dragPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, hitPoint);

  const offset = new THREE.Vector3().subVectors(
    new THREE.Vector3(found.body.position.x, found.body.position.y, found.body.position.z),
    hitPoint
  );

  dragging = {
    obj: found,
    plane: dragPlane,
    offset: offset,
    prevPos: new THREE.Vector3(found.body.position.x, found.body.position.y, found.body.position.z),
    velocity: new THREE.Vector3(),
    prevTime: performance.now(),
  };

  // Fade hint
  document.getElementById('hint').style.opacity = '0';
});

renderer.domElement.addEventListener('pointermove', (event) => {
  if (!dragging) return;

  mouse.copy(getMouseNDC(event));
  raycaster.setFromCamera(mouse, camera);

  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(dragging.plane, target);
  if (!target) return;

  target.add(dragging.offset);

  // Keep above ground
  const hy = dragging.obj.halfExtents.y;
  if (target.y < hy) target.y = hy;

  // Track velocity for throw
  const now = performance.now();
  const dt = (now - dragging.prevTime) / 1000;
  if (dt > 0.001) {
    dragging.velocity.subVectors(target, dragging.prevPos).divideScalar(dt);
    dragging.prevPos.copy(target);
    dragging.prevTime = now;
  }

  dragging.obj.body.position.set(target.x, target.y, target.z);
});

const onPointerUp = () => {
  if (!dragging) return;

  const body = dragging.obj.body;
  body.type = CANNON.Body.DYNAMIC;
  body.wakeUp();

  // Apply throw velocity
  const v = dragging.velocity;
  const maxV = 20;
  v.clampScalar(-maxV, maxV);
  body.velocity.set(v.x, v.y, v.z);

  // Some angular velocity for flair
  body.angularVelocity.set(
    (Math.random() - 0.5) * 5,
    (Math.random() - 0.5) * 5,
    (Math.random() - 0.5) * 5
  );

  dragging = null;
  controls.enabled = true;
  document.body.classList.remove('dragging');
};

renderer.domElement.addEventListener('pointerup', onPointerUp);
renderer.domElement.addEventListener('pointerleave', onPointerUp);

// ── Animation Loop ──
const clock = new THREE.Clock();
const fixedTimeStep = 1 / 60;

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  world.step(fixedTimeStep, delta, 3);

  // Sync Three.js meshes to Cannon bodies
  for (const { mesh, body } of objectBodies) {
    mesh.position.copy(body.position);
    mesh.quaternion.copy(body.quaternion);
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
